<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascendra — Enterprise Performance Management</title>
  <meta name="description" content="Ascendra: Enterprise-grade goal setting, tracking and governance portal for organizational alignment and accountability." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />
  <!-- Ascendra "A" logo as favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300AAFF'/%3E%3Cstop offset='100%25' stop-color='%230033AA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='50,5 90,90 65,90 50,55 35,90 10,90' fill='url(%23g)'/%3E%3Cpolygon points='50,40 65,70 35,70' fill='%23001A66' opacity='0.5'/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="ld-wrap">
        <!-- Ascendra SVG Logo Mark -->
        <div class="ld-logo">
          <svg width="36" height="36" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ascendra-grad-load" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38BFFF"/>
                <stop offset="100%" stop-color="#1A56DB"/>
              </linearGradient>
            </defs>
            <!-- Left face of A -->
            <polygon points="30,4 8,56 20,56 30,32" fill="url(#ascendra-grad-load)" opacity="0.95"/>
            <!-- Right face of A -->
            <polygon points="30,4 52,56 40,56 30,32" fill="#1A56DB" opacity="0.85"/>
            <!-- Crossbar shadow -->
            <polygon points="22,40 38,40 34,50 26,50" fill="#0A2A6E" opacity="0.45"/>
          </svg>
        </div>
        <div class="ld-title">Ascendra</div>
        <div class="ld-sub">Enterprise Performance Management</div>
        <div class="ld-bar"><div class="ld-fill"></div></div>
      </div>
    </div>

    <!-- App Shell (injected by main.js) -->
    <div id="app-shell" style="display:none;"></div>

    <!-- Modals & Toasts -->
    <div id="modal-root"></div>
    <div id="toast-root" style="position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;gap:10px;"></div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
